name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 回归测试
        run: python tests/test_regressions.py

      - name: 冒烟渲染(中文路径;HOME 隔离仅 POSIX 生效,Windows 的 Python 用 USERPROFILE,runner 即用即弃无害)
        env:
          KIMI_SL_NOCOLOR: '1'
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          out=$(echo '{"model":"K3","cwd":"D:/用户/项目","gitBranch":"main","permissionMode":"auto","planMode":false,"contextUsage":0.1,"contextTokens":1000,"maxContextTokens":1048576,"sessionId":"","version":"ci"}' | python statusline.py)
          test -n "$out"
          echo "$out"

      - name: 安装/卸载往返(临时 KIMI_CODE_HOME)
        env:
          KIMI_CODE_HOME: ${{ runner.temp }}/kc
        run: |
          python install.py
          grep -q '^\[status_line\]' "$KIMI_CODE_HOME/tui.toml"
          python install.py
          python uninstall.py
          ! grep -q 'statusline\.py' "$KIMI_CODE_HOME/tui.toml"

      - name: Windows 真机路径压测(真实 Node spawn 复刻 TUI 的 cmd /d /s /c + detached 不闪窗 + UTF-8)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File ./tests/windows-e2e.ps1
